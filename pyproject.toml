[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "microburbs-valuation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.3.3", "pyarrow==22.0.0", "scikit-learn==1.6.1", "lightgbm==4.6.0", "psutil==7.1.3"]

[project.scripts]
mb = "microburbs.final:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

